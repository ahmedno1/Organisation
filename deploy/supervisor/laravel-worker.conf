[program:institutions-system-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/institutions-system/artisan queue:work --sleep=3 --tries=3 --timeout=120 --queue=default
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/institutions-system-worker.log
stopwaitsecs=3600
