<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f4c7a"/>
      <stop offset="55%" stop-color="#1f6f8b"/>
      <stop offset="100%" stop-color="#2b8a78"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="930" cy="170" r="170" fill="#ffffff" opacity="0.08"/>
  <circle cx="130" cy="930" r="220" fill="#ffffff" opacity="0.06"/>

  <g direction="rtl">
    <text x="920" y="170" fill="#ffffff" font-size="58" font-family="Tahoma, Arial, sans-serif" font-weight="700" text-anchor="end">
      منصة إدارة الأسر والمؤسسات
    </text>

    <text x="920" y="255" fill="#d9f3ff" font-size="34" font-family="Tahoma, Arial, sans-serif" font-weight="600" text-anchor="end">
      الحل الذكي لتوحيد البيانات وتسريع الدعم
    </text>

    <rect x="120" y="320" width="840" height="500" rx="24" fill="#ffffff" opacity="0.95"/>

    <text x="910" y="390" fill="#113256" font-size="34" font-family="Tahoma, Arial, sans-serif" font-weight="700" text-anchor="end">
      المشكلة
    </text>
    <text x="910" y="440" fill="#24455f" font-size="28" font-family="Tahoma, Arial, sans-serif" text-anchor="end">
      تشتت بيانات الأسر بين ملفات ووسائل متعددة
    </text>
    <text x="910" y="480" fill="#24455f" font-size="28" font-family="Tahoma, Arial, sans-serif" text-anchor="end">
      يسبب تكرار السجلات وتأخير وصول المساعدة
    </text>

    <text x="910" y="560" fill="#113256" font-size="34" font-family="Tahoma, Arial, sans-serif" font-weight="700" text-anchor="end">
      الحل
    </text>
    <text x="910" y="610" fill="#24455f" font-size="28" font-family="Tahoma, Arial, sans-serif" text-anchor="end">
      نظام موحد لإدارة الأسر، التحقق من البيانات،
    </text>
    <text x="910" y="650" fill="#24455f" font-size="28" font-family="Tahoma, Arial, sans-serif" text-anchor="end">
      الصلاحيات، التقارير، والمتابعة الدقيقة للحالات
    </text>

    <text x="910" y="740" fill="#0f6a63" font-size="30" font-family="Tahoma, Arial, sans-serif" font-weight="700" text-anchor="end">
      النتيجة: قرارات أسرع وعدالة أكبر في توزيع المساعدات
    </text>
  </g>

  <text x="540" y="1000" fill="#e8f7ff" font-size="24" font-family="Tahoma, Arial, sans-serif" text-anchor="middle">
    institutions-system
  </text>
</svg>
